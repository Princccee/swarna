name: CI

# Runs on every pull request, and is called by deploy.yml before anything is deployed.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared types
        working-directory: packages/shared-types
        run: npx tsc

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - name: Build API
        run: npm run build --workspace=apps/api

      - name: Test API
        run: npm run test --workspace=apps/api -- --ci

      - name: Build web (typecheck + bundle)
        run: npm run build --workspace=apps/web
