# Full stack — all services including built app images
# Usage: docker compose up --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: svarna
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-svarna}
      POSTGRES_DB: svarna
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U svarna -d svarna']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:1.0.5
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_REGION: ${S3_REGION:-ap-south-1}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - s3_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/health']
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://svarna:${POSTGRES_PASSWORD:-svarna}@postgres:5432/svarna
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-svarna-dev-access-secret-change-in-prod-32c}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-svarna-dev-refresh-secret-change-in-prod-32c}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      S3_ENDPOINT: http://rustfs:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      S3_BUCKET: svarna
      S3_REGION: ${S3_REGION:-ap-south-1}
      GSTIN: ${GSTIN:-22AAAAA0000A1Z5}
      GST_STATE_CODE: ${GST_STATE_CODE:-22}
      IS_INTERSTATE: ${IS_INTERSTATE:-false}
      SHOP_NAME: ${SHOP_NAME:-Svarna Jewels}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-32-byte-hex-key-change-in-prod-xx}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-svarna-wa-verify}
      # Meta app secret — verifies webhook signatures. Required in production.
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      # Demo/mock rates are never billable in production; set true only for local demos
      ALLOW_DEMO_RATES: ${ALLOW_DEMO_RATES:-false}
      # Billing refuses rates older than this many hours
      RATE_MAX_AGE_HOURS: ${RATE_MAX_AGE_HOURS:-48}
      # First-run only: creates this owner if the database has no users (see owner-bootstrap.service.ts)
      BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL:-}
      BOOTSTRAP_OWNER_PASSWORD: ${BOOTSTRAP_OWNER_PASSWORD:-}
      BOOTSTRAP_OWNER_NAME: ${BOOTSTRAP_OWNER_NAME:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/v1/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      # Local-only by default. Set WEB_BIND=0.0.0.0 in .env to open the app to other devices on
      # your Wi-Fi (e.g. a phone). Leave unset on servers — Caddy serves the app over HTTPS there.
      - '${WEB_BIND:-127.0.0.1}:5173:80'
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  s3_data:
